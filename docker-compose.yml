name: cognitive-wizard

services:

  ai-backend:
    build:
      context: ./server/py_server
    volumes:
      - ai-media:/app/media
      - ai-vectors:/app/vectorDB
    ports:
      - "8000:8000"
    env_file:
      - ./server/py_server/.env
    environment:
      MEDIA_DIR: server/py_server/media
      CHROMA_PERSIST_DIR: server/py_server/vectorDB/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  api-gateway:
    build:
      context: ./server/js_server
    ports:
      - "3000:3000"
    depends_on:
      ai-backend:
        condition: service_healthy
    env_file:
      - ./server/js_server/.env
    environment:
      PY_SERVER_URL: http://ai-backend:8000
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./client
      args:
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-http://localhost:3000}
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health" ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  ai-media:
  ai-vectors:
