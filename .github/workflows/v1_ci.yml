name: CognitiveWizard CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # 1. FRONTEND CI: React 19 + Vite Client Build Verification
  # ============================================================================
  client-ci:
    name: Frontend Build (React 19 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Production Build
        run: npm run build

  # ============================================================================
  # 2. GATEWAY CI: Express.js + Sequelize Gateway Verification
  # ============================================================================
  gateway-ci:
    name: API Gateway Verification (Express.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server/js_server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/js_server/package-lock.json

      - name: Install Gateway Dependencies
        run: npm ci

      - name: Syntax & Structural Validation
        run: |
          node --check index.js
          node --check config/db.js
          node --check models/index.js
          node --check controllers/wizardController.js
          node --check controllers/authController.js

      - name: Run Gateway Tests
        run: npm test

  # ============================================================================
  # 3. AI ENGINE CI: FastAPI, LangGraph, and Celery Worker Verification
  # ============================================================================
  ai-engine-ci:
    name: AI Engine & Workers (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: ./server/py_server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: server/py_server/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio

      - name: Python Bytecode Compilation Check
        run: |
          python -m py_compile main.py
          python -m py_compile core/celery_app.py
          python -m py_compile config/settings.py

      - name: Lint with Flake8 (Fatal & Syntax Errors)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Test Suite
        env:
          DATABASE_URL: "mysql+pymysql://test:test@localhost:3306/test_db"
          MONGO_URI: "mongodb://localhost:27017/test_chat"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test_secret_for_ci"
          LOG_LEVEL: "info"
        run: |
          pytest tests/test_quiz_generator.py tests/test_v1_rag_chain.py -v

  # ============================================================================
  # 4. CI STATUS: Unified Gate Check for Branch Protection Rules
  # ============================================================================
  ci-status:
    name: CI Pipeline Status
    runs-on: ubuntu-latest
    needs: [client-ci, gateway-ci, ai-engine-ci]
    if: always()
    steps:
      - name: Evaluate Pipeline Results
        run: |
          if [ "${{ needs.client-ci.result }}" != "success" ] || \
             [ "${{ needs.gateway-ci.result }}" != "success" ] || \
             [ "${{ needs.ai-engine-ci.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed."
            echo "client-ci: ${{ needs.client-ci.result }}"
            echo "gateway-ci: ${{ needs.gateway-ci.result }}"
            echo "ai-engine-ci: ${{ needs.ai-engine-ci.result }}"
            exit 1
          fi
          echo "✅ All CI checks passed successfully."
